spring:
  application:
    name: fleetmgm-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/fleetmgm}
    username: ${SPRING_DATASOURCE_USERNAME:fleetmgm}
    password: ${SPRING_DATASOURCE_PASSWORD:fleetmgm}
    driver-class-name: org.postgresql.Driver
    hikari:
      # HikariCP defaults to 10 connections and keeps all 10 open for as long as the app runs. Each
      # one is a Postgres backend process holding its own memory, paid for around the clock on a
      # metered host for a single-instance app that never sees concurrent load. 5 is still more than
      # this workload uses; minimum-idle lets the pool shrink back to 1 between demos.
      maximum-pool-size: ${DB_POOL_MAX_SIZE:5}
      minimum-idle: ${DB_POOL_MIN_IDLE:1}
      idle-timeout: 60000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

jwt:
  secret: ${JWT_SECRET:changeme-changeme-changeme-changeme-changeme-changeme-changeme-changeme}
  access-token-expiration-ms: 900000      # 15 min
  refresh-token-expiration-ms: 604800000  # 7 days

workshop:
  auto-create-schedule-on-maintenance-create: ${WORKSHOP_AUTO_CREATE_SCHEDULE:true}

billing:
  default-tax-rate: ${BILLING_DEFAULT_TAX_RATE:0.2100}

gps:
  # Only the latest position per vehicle is ever read (the live map), so older rows are dead weight.
  # At one row per active vehicle every 30s, a 7-day window holds ~20k rows per vehicle instead of
  # growing without bound. Must be >= 1: see GpsRetentionScheduler.
  retention-days: ${GPS_RETENTION_DAYS:7}

  mock:
    # Off by default, everywhere. The generator is the only part of this app that works when nobody
    # is using it, and on a host that bills by the minute that is a bill for data no one is looking
    # at. The Mapa GPS page carries a switch (ADMIN/MANAGER) that turns it on for a demo; the local
    # docker-compose demo costs nothing, so it overrides this to true. See GpsMockState.
    enabled-on-startup: ${GPS_MOCK_ENABLED_ON_STARTUP:false}
    interval-ms: ${GPS_MOCK_INTERVAL_MS:30000}
    # Activation is a lease: it lapses on its own, so a demo left open stops writing instead of
    # running until someone remembers the switch. 0 turns the auto-disable off entirely.
    auto-disable-after-minutes: ${GPS_MOCK_AUTO_DISABLE_MINUTES:30}

server:
  tomcat:
    threads:
      # Tomcat's default ceiling is 200 request threads, each with its own stack reserved on first
      # use. A demo deployment serving a handful of concurrent users never needs them, and the
      # headroom is memory that gets paid for rather than used.
      max: ${SERVER_THREADS_MAX:20}
      min-spare: 2

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO

---
spring:
  config:
    activate:
      on-profile: dev

  jpa:
    show-sql: true

logging:
  level:
    com.fleetmgm: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

---
spring:
  config:
    activate:
      on-profile: prod

  jpa:
    show-sql: false

springdoc:
  swagger-ui:
    enabled: false

# Railway (and any TLS-terminating reverse proxy) forwards the original request as plain HTTP
# with X-Forwarded-Proto: https — without this, Tomcat sees every request as insecure, and
# Spring Security's HSTS header (gated on request.isSecure()) would never actually fire in prod.
# Scoped to prod only, not global: honoring these headers means trusting whatever sits in front
# of this process, which is only true for Railway's edge, not the local nginx passthrough used
# for the docker-compose demo (that one is a real plain-HTTP hop, not a TLS-terminating proxy).
server:
  forward-headers-strategy: framework

jwt:
  secret: ${JWT_SECRET}

---
spring:
  config:
    activate:
      on-profile: demo

  # V20__seed_demo_data.sql lives in db/seed, NOT db/migration, precisely so it never runs for
  # @DataJpaTest/@SpringBootTest (which apply classpath:db/migration only, per the default
  # spring.flyway.locations at the top of this file). Discovered the hard way: with the seed file
  # under db/migration, every @DataJpaTest got Flyway-seeded with 69 client invoices numbered
  # INV-2026-00001..00069, colliding with repository tests that hardcode small literal invoice
  # numbers as fixtures (LineItemRepositoryTest, ProfitabilityRepositoryTest, etc. all failed with
  # "duplicate key value violates unique constraint uq_invoices_number"). This profile is additive
  # (extends, not replaces, spring.flyway.locations) and is only activated for the docker-compose
  # demo (SPRING_PROFILES_ACTIVE=prod,demo) — never in tests or CI.
  flyway:
    locations: classpath:db/migration,classpath:db/seed
